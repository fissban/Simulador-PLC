<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulador PLC - Registros</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <h1>Registros Modbus + AddressData</h1>
    <div class="meta">Total de registros: <strong id="total-count">0</strong> | Actualización parcial cada 1000ms</div>
    <table>
        <thead>
            <tr>
                <th>Address</th>
                <th>Type</th>
                <th>Name</th>
                <th>Description</th>
                <th>Writable</th>
                <th>Runtime Function</th>
                <th>Expression</th>
                <th>Value (JSON)</th>
                <th>Value (Modbus)</th>
            </tr>
        </thead>
        <tbody id="rows-body"></tbody>
    </table>
    <script src="/app.js" defer></script>
</body>
</html>
